<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4CFD6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="imSept2">
  <meta name="description" content="imSept2 个人工作台 - 随手记、计划复盘、生活、工作、学习、记账一站式管理">
  <title>imSept2 工作台</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css?v=202607281556">
</head>
<body>
  <div id="app">
    <!-- Mobile top bar -->
    <header class="mobile-header" id="mobileHeader">
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="mobile-title" id="mobileTitle">首页</span>
      <div class="mobile-spacer"></div>
    </header>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">iS</div>
        <div class="sidebar-title">imSept2</div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <a class="nav-item active" data-page="home" data-label="首页">
          <span class="nav-emoji">🏠</span>
          <span>首页</span>
        </a>
        <a class="nav-item" data-page="notes" data-label="随手记">
          <span class="nav-emoji">📝</span>
          <span>随手记</span>
        </a>
        <a class="nav-item" data-page="plans" data-label="计划复盘">
          <span class="nav-emoji">📅</span>
          <span>计划复盘</span>
        </a>
        <a class="nav-item" data-page="life" data-label="生活相关">
          <span class="nav-emoji">💧</span>
          <span>生活相关</span>
        </a>
        <a class="nav-item" data-page="work" data-label="工作相关">
          <span class="nav-emoji">💼</span>
          <span>工作相关</span>
        </a>
        <a class="nav-item" data-page="study" data-label="学习相关">
          <span class="nav-emoji">📚</span>
          <span>学习相关</span>
        </a>
        <a class="nav-item" data-page="accounting" data-label="记账">
          <span class="nav-emoji">💰</span>
          <span>记账</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-date" id="sidebarDate"></div>
      </div>
    </aside>

    <!-- Main content -->
    <main class="content" id="content">
      <div id="pageContainer"></div>
    </main>
  </div>

  <!-- Floating action button (mobile) -->
  <button class="fab" id="fab" style="display:none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Modal container -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle"></h3>
        <button class="modal-close" id="modalClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter" style="display:none">
        <button class="btn btn-primary" id="modalConfirm">确认</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js?v=202607281556"></script>
  <script src="js/pages.js?v=202607281556"></script>
  <script src="js/app.js?v=202607281556"></script>
</body>
</html>
