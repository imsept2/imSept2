<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- "iS" text -->
  <text x="256" y="300" font-size="220" font-weight="800" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-8">iS</text>
  <!-- Decorative dots -->
  <circle cx="120" cy="120" r="8" fill="rgba(255,255,255,0.3)"/>
  <circle cx="392" cy="120" r="6" fill="rgba(255,255,255,0.2)"/>
  <circle cx="120" cy="392" r="6" fill="rgba(255,255,255,0.2)"/>
  <circle cx="392" cy="392" r="10" fill="rgba(255,255,255,0.25)"/>
  <!-- Bottom accent bar -->
  <rect x="160" y="380" width="192" height="6" rx="3" fill="url(#accent)" opacity="0.6"/>
</svg>
